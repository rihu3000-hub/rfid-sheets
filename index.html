<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live RFID Attendance & Access Log</title>
    <style>
        /* Embedded Fallback Styles to completely bypass GitHub CDN blocks */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; padding: 2rem 1rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        
        header { display: flex; justify-content: space-between; align-items: center; border-b: 1px solid #1e293b; padding-bottom: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid #1e293b; }
        h1 { font-size: 1.85rem; font-weight: 800; background: linear-gradient(to right, #38bdf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { color: #94a3b8; margin-top: 0.25rem; font-size: 0.95rem; }
        
        .status-badge { display: flex; align-items: center; background-color: rgba(30, 41, 59, 0.5); padding: 0.5rem 1rem; rounded-radius: 0.75rem; border: 1px solid rgba(51, 65, 85, 0.5); border-radius: 12px; }
        .live-pulse { color: #34d399; font-weight: 600; font-size: 0.875rem; display: flex; align-items: center; gap: 0.5rem; }
        .live-pulse::before { content: ''; width: 8px; height: 8px; background-color: #34d399; border-radius: 50%; display: inline-block; }
        #last-updated { font-size: 0.75rem; color: #94a3b8; margin-left: 0.75rem; }

        .grid { display: grid; grid-template-columns: 1fr; gap: 1.5rem; margin-bottom: 2rem; }
        @media (min-width: 768px) { .grid { grid-template-columns: 1fr 2fr; } }
        
        .card { background-color: rgba(30, 41, 59, 0.4); border: 1px solid rgba(51, 65, 85, 0.6); padding: 1.5rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .card-title { color: #94a3b8; font-weight: 500; font-size: 0.875rem; margin-bottom: 1rem; text-transform: uppercase; tracking: 0.05em; }
        .metric { font-size: 2.5rem; font-weight: 700; color: #ffffff; }
        
        .latest-container { display: flex; align-items: center; gap: 1rem; }
        .avatar-icon { width: 3rem; height: 3rem; background-color: rgba(52, 211, 153, 0.1); color: #34d399; border-radius: 0.75rem; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.25rem; border: 1px solid rgba(52, 211, 153, 0.2); }
        .latest-name { font-size: 1.25rem; font-weight: 700; color: #ffffff; }
        .latest-meta { font-size: 0.875rem; color: #94a3b8; margin-top: 0.25rem; font-family: monospace; }

        .table-container { background-color: rgba(30, 41, 59, 0.4); border: 1px solid rgba(51, 65, 85, 0.6); border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .table-header { padding: 1rem 1.5rem; border-b: 1px solid rgba(51, 65, 85, 0.6); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(51, 65, 85, 0.6); }
        .table-title { font-size: 1.125rem; font-weight: 600; }
        
        button { background-color: #334155; color: #f8fafc; border: 1px solid #475569; padding: 0.5rem 1rem; border-radius: 0.5rem; font-size: 0.875rem; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #475569; }

        table { w-width: 100%; width: 100%; border-collapse: collapse; text-align: left; }
        th { background-color: rgba(30, 41, 59, 0.6); color: #94a3b8; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; tracking: 0.05em; padding: 0.75rem 1.5rem; border-bottom: 1px solid rgba(51, 65, 85, 0.6); }
        td { padding: 1rem 1.5rem; font-size: 0.875rem; border-bottom: 1px solid #1e293b; }
        tr:hover { background-color: rgba(30, 41, 59, 0.2); }
        
        .uid-badge { background-color: #1e293b; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-family: monospace; color: #38bdf8; border: 1px solid rgba(51, 65, 85, 0.5); }
        .status-text { font-weight: 600; color: #34d399; }
        .mono { font-family: monospace; color: #cbd5e1; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div>
                <h1>ESP32 RFID Management Hub</h1>
                <div class="subtitle">IT Expo Live Monitoring Dashboard</div>
            </div>
            <div class="status-badge">
                <span class="live-pulse">System Live</span>
                <span id="last-updated">Syncing...</span>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <div class="card-title">Total Card Scans</div>
                <p id="total-scans" class="metric">0</p>
            </div>
            <div class="card">
                <div class="card-title">Most Recent Scan Activity</div>
                <div id="latest-scan-container" class="latest-container">
                    <div class="avatar-icon">✓</div>
                    <div>
                        <div class="latest-name">Live Terminal Mode</div>
                        <div class="latest-meta">Waiting for data stream transmission...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <div class="table-title">Live Transmission History Log</div>
                <button onclick="fetchSheetData()">Force Refresh</button>
            </div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Date and Time</th>
                            <th>RFID UID</th>
                            <th>Student Name</th>
                        </tr>
                    </thead>
                    <tbody id="data-rows">
                        <tr>
                            <td colspan="3" style="padding: 3rem; text-align: center; color: #64748b;">Connecting to live hardware database...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CSV_URL = "https://google.com";

        async function fetchSheetData() {
            try {
                const response = await fetch(CSV_URL + '&t=' + new Date().getTime());
                const text = await response.text();
                
                const rows = text.split('\n')
                    .map(row => row.split(',').map(cell => cell.trim().replace(/^"|"$/g, '')))
                    .filter(row => row.length >= 3 && row.some(cell => cell !== ''));

                if(rows.length <= 1) return;

                const data = rows.slice(1).reverse();

                document.getElementById('total-scans').innerText = data.length;
                document.getElementById('last-updated').innerText = `Sync: ${new Date().toLocaleTimeString()}`;

                const latest = data[0];
                const latestUID = latest[0] || 'Unknown';
                const latestUser = latest[1] || 'Unregistered Tag';
                const latestTime = latest[2] || 'N/A';

                document.getElementById('latest-scan-container').innerHTML = `
                    <div class="avatar-icon">✓</div>
                    <div>
                        <div class="latest-name">${latestUser}</div>
                        <div class="latest-meta">UID: ${latestUID} &bull; <span>${latestTime}</span></div>
                    </div>
                `;

                const tbody = document.getElementById('data-rows');
                tbody.innerHTML = '';
                
                data.forEach(row => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="mono">${row[2] || '—'}</td>
                        <td><span class="uid-badge">${row[0] || '—'}</span></td>
                        <td class="status-text">${row[1] || '—'}</td>
                    `;
                    tbody.appendChild(tr);
                });

            } catch (error) {
                console.error("Data ingestion failure:", error);
            }
        }

        fetchSheetData();
        setInterval(fetchSheetData, 3000);
    </script>
</body>
</html>
